name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "${{ secrets.FRAY_KEYSTORE_BASE64 }}" | base64 -d > fray-release.jks
      - run: ./gradlew :app:assembleRelease :app:testDebugUnitTest
        env:
          FRAY_KEYSTORE: ${{ github.workspace }}/fray-release.jks
          FRAY_KEYSTORE_PASSWORD: ${{ secrets.FRAY_KEYSTORE_PASSWORD }}
          FRAY_KEY_ALIAS: ${{ secrets.FRAY_KEY_ALIAS }}
          FRAY_KEY_PASSWORD: ${{ secrets.FRAY_KEY_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk "FrayShare-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: FrayShare-*.apk
